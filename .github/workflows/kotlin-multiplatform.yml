name: VyonEx

on:
  push:
  pull_request:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-vyonex-attribution.mjs
      - run: node --test scripts/check-vyonex-attribution.test.mjs

  jvm:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat jvmTest jvmJar

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jvmTest iosSimulatorArm64Test linkDebugFrameworkIosArm64 linkDebugFrameworkIosSimulatorArm64 linkDebugFrameworkIosX64 assembleVyonExDebugXCFramework
      - name: Type-check the Swift extraction API
        run: xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios15.0-simulator -F build/XCFrameworks/debug/VyonEx.xcframework/ios-arm64_x86_64-simulator ci/VyonExApiCheck.swift
